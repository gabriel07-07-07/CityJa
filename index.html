<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071321"><title>CityJá — Sua cidade na palma da mão</title>
<style>
:root{--bg:#06111d;--panel:#0d1b2b;--line:#20364f;--text:#f5f7fb;--muted:#9eacc0;--orange:#ff7a00}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#15385a 0,#06111d 38%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#06111de8;border-bottom:1px solid #17304a}
.brand{font-size:28px;font-weight:900}.brand i{font-style:normal;color:var(--orange)}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#0b1928;border-radius:14px;color:white}
.hero{margin:14px;padding:24px 18px;border:1px solid #29435f;border-radius:26px;background:linear-gradient(145deg,#102a43,#071522 72%)}
.hero h1{font-size:31px;line-height:1.05;margin:0 0 10px}.hero h1 span{color:var(--orange)}.hero p{color:#d5dfeb}
.search{display:flex;gap:8px;background:#091522;border:1px solid #29435f;border-radius:17px;padding:7px}.search input{flex:1;border:0;outline:0;background:transparent;color:white;padding:11px}.search button{border:0;background:var(--orange);width:44px;border-radius:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 22px}.quick button{padding:15px;border:1px solid var(--line);background:var(--panel);color:white;border-radius:18px;text-align:left}.quick b{display:block;font-size:19px}.muted{color:var(--muted)}
section{padding:0 14px}.title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}.title h2{font-size:19px;margin:0}.link{color:#ffad24;border:0;background:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{min-height:92px;border:1px solid var(--line);background:#10243a;color:white;border-radius:18px;padding:9px 4px}.cat b{display:block;font-size:27px;margin-bottom:7px}.cat span{font-size:12px}
.cards{display:grid;gap:11px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#102238,#0b1725);border-radius:19px;padding:12px}.photo{height:120px;border-radius:14px;background:linear-gradient(135deg,#253d59,#8a4b1e);display:flex;align-items:flex-end;padding:12px;font-size:18px;font-weight:850;margin-bottom:11px}
.row{display:flex;justify-content:space-between;gap:10px}.rating{color:#ffd15a}.screen{display:none}.screen.on{display:block}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#06111df5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
nav button{background:none;border:0;color:#8090a5;font-size:10px}nav button b{display:block;font-size:21px}nav button.on{color:var(--orange)}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(520px,100%);background:#071321;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}
.form label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:#0b1928;color:white;border-radius:12px;padding:12px;outline:none}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.primary{background:var(--orange);color:#111}.secondary{background:#13253a;color:white;border:1px solid var(--line)}
.tabs{display:flex;gap:8px}.tabs button{flex:1}.selected{background:var(--orange);color:#111}.authmsg{min-height:22px;font-size:13px;color:#ff8295}.empty{padding:25px;text-align:center;border:1px dashed #31506e;border-radius:18px;color:var(--muted)}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mediaGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.mediaItem{position:relative;border:1px solid var(--line);background:#091522;border-radius:16px;overflow:hidden;min-height:150px}.mediaItem img,.mediaItem video{display:block;width:100%;height:180px;object-fit:cover;background:#02070d}.mediaDelete{position:absolute;top:7px;right:7px;border:0;border-radius:10px;background:#000b;color:#fff;padding:7px 9px}.menuItem{text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,#102238,#0b1725);color:white;border-radius:18px;padding:16px}.menuItem b{display:block;font-size:25px;margin-bottom:7px}.reviewStars{display:flex;gap:6px;margin:10px 0 14px}.reviewStar{border:1px solid var(--line);background:#0b1928;color:#64748b;border-radius:12px;width:48px;height:48px;font-size:28px}.reviewStar.on{color:#ffd15a;background:#2a2110;border-color:#7a5b18}.reviewModalBox{width:min(520px,100%);background:#071321;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px}.reviewModalBox textarea{width:100%;border:1px solid var(--line);background:#0b1928;color:white;border-radius:12px;padding:12px;outline:none;resize:vertical}.ratingSummary{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px;border:1px solid var(--line);background:#091522;border-radius:16px}.ratingBig{font-size:32px;font-weight:900;color:#ffd15a}.reviewCard{margin-bottom:10px}.reviewCard .rating{font-size:17px}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="iconbtn" onclick="toast('Menu em breve')">☰</button><div class="brand">City<i>Já</i></div><button class="iconbtn" onclick="go('profile')">♙</button></header>

<main id="home" class="screen on">
<div class="hero"><h1>Descubra o melhor da <span>Grande Vitória</span></h1><p>Tudo o que você precisa, perto de você.</p><div class="search"><input id="q" placeholder="Buscar lugares, serviços, eventos..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">⌕</button></div></div>
<div class="quick"><button onclick="near()"><b>📍 Perto de mim</b><span class="muted">Ver tudo ao redor</span></button><button onclick="go('explore')"><b>🗺️ No mapa</b><span class="muted">Explorar lugares</span></button></div>
<section><div class="title"><h2>Categorias</h2><button class="link" onclick="go('explore')">Ver todas</button></div><div class="cats">
<button class="cat" onclick="filter('Restaurante')"><b>🍔</b><span>Restaurantes</span></button><button class="cat" onclick="filter('Bar')"><b>🍺</b><span>Bares</span></button><button class="cat" onclick="filter('Hotel')"><b>🛏️</b><span>Hotéis</span></button><button class="cat" onclick="filter('Motel')"><b>❤️</b><span>Motéis</span></button><button class="cat" onclick="filter('Comércio')"><b>🛍️</b><span>Comércio</span></button><button class="cat" onclick="go('events')"><b>🎵</b><span>Eventos</span></button><button class="cat" onclick="promos()"><b>🎟️</b><span>Promoções</span></button><button class="cat" onclick="filter('Café')"><b>☕</b><span>Cafés</span></button>
</div></section>
<section><div class="title"><h2>🔥 Destaques para você</h2></div><div id="homeList" class="cards"></div></section>
</main>

<section id="explore" class="screen"><div class="title"><h2>Explorar</h2><button class="link" onclick="go('home')">Início</button></div><div id="list" class="cards"></div></section>
<section id="events" class="screen"><div class="title"><h2>🎵 Eventos</h2></div><div id="eventList" class="cards"></div></section>
<section id="promos" class="screen"><div class="title"><h2>🎟️ Promoções</h2></div><div id="promoList" class="cards"></div></section><section id="details" class="screen"><button class="btn secondary" onclick="go('explore')">← Voltar</button><div id="detailsContent"></div></section>

<section id="profile" class="screen">
<div class="title"><h2>👤 Meu perfil</h2></div>
<div class="card"><h3 id="pname">Visitante</h3><p id="pemail" class="muted"></p><p id="prole" class="muted"></p></div>
<button id="merchantBtn" class="btn primary" style="width:100%;margin-top:10px;display:none" onclick="merchantPanel()">🏪 Área do comerciante</button>
<button id="profileAuth" class="btn primary" style="width:100%;margin-top:10px" onclick="openAuth('login')">🔐 Entrar / Criar conta</button>
<button id="logoutBtn" class="btn secondary" style="width:100%;margin-top:10px;display:none" onclick="logout()">Sair da conta</button>
</section>

<section id="merchant" class="screen"><button class="btn secondary" onclick="go('profile')">← Perfil</button><div id="merchantContent"></div></section>
<section id="merchantRegister" class="screen"><button class="btn secondary" onclick="merchantPanel()">← Painel</button><div id="merchantFormContent"></div></section>

<nav><button class="on" onclick="go('home',this)"><b>⌂</b>Início</button><button onclick="go('explore',this)"><b>⌕</b>Explorar</button><button onclick="merchantPanel()"><b>＋</b>Cadastro</button><button onclick="go('events',this)"><b>☆</b>Eventos</button><button onclick="go('profile',this)"><b>♙</b>Perfil</button></nav>

<div id="authModal" class="modal" onclick="if(event.target===this)closeAuth()"><div class="sheet">
<div class="title"><h2 id="authTitle">Entrar</h2><button class="link" onclick="closeAuth()">Fechar</button></div>
<div class="tabs"><button id="loginTab" class="btn selected" onclick="setMode('login')">Entrar</button><button id="registerTab" class="btn secondary" onclick="setMode('register')">Criar conta</button></div>
<form class="form" onsubmit="submitAuth(event)">
<div id="nameBox" style="display:none"><label>Nome</label><input id="authName" placeholder="Seu nome"></div>
<label>E-mail</label><input id="authEmail" type="email" placeholder="seu@email.com" required>
<label>Senha</label><input id="authPassword" type="password" placeholder="Mínimo de 6 caracteres" required>
<div id="roleBox" style="display:none"><label>Tipo de conta</label><select id="authRole"><option value="user">Usuário</option><option value="merchant">Comerciante</option></select></div>
<div id="authMsg" class="authmsg"></div><button id="authSubmit" class="btn primary" style="width:100%" type="submit">Entrar</button>
</form></div></div>
<div id="reviewModal" class="modal" onclick="if(event.target===this)closeReview()"><div class="reviewModalBox">
  <div class="title"><h2>⭐ Avaliar estabelecimento</h2><button class="link" onclick="closeReview()">Fechar</button></div>
  <p id="reviewStoreName" class="muted"></p>
  <div class="reviewStars" id="reviewStars">
    <button class="reviewStar" data-rating="1" onclick="setReviewRating(1)">★</button>
    <button class="reviewStar" data-rating="2" onclick="setReviewRating(2)">★</button>
    <button class="reviewStar" data-rating="3" onclick="setReviewRating(3)">★</button>
    <button class="reviewStar" data-rating="4" onclick="setReviewRating(4)">★</button>
    <button class="reviewStar" data-rating="5" onclick="setReviewRating(5)">★</button>
  </div>
  <div id="reviewRatingLabel" class="muted">Escolha uma nota de 1 a 5 estrelas.</div>
  <label style="display:block;color:var(--muted);font-size:12px;margin:14px 0 5px">Comentário (opcional)</label>
  <textarea id="reviewText" rows="4" placeholder="Conte como foi sua experiência..."></textarea>
  <button class="btn primary" style="width:100%;margin-top:14px" onclick="submitReview()">⭐ Enviar avaliação</button>
</div></div>
<div id="toast" style="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:white;color:#111;padding:11px 15px;border-radius:13px;display:none;z-index:80"></div>
</div>

<script>
let biz = [];
let token = localStorage.getItem('cityja_token');
let authMode = 'login';

const $ = id => document.getElementById(id);

async function api(u, o = {}) {
  o.headers = {
    ...(o.headers || {}),
    'Content-Type': 'application/json',
    ...(token ? {'Authorization': 'Bearer ' + token} : {})
  };
  const r = await fetch(u, o);
  const j = await r.json();
  if (!r.ok) throw Error(j.error || 'Erro');
  return j;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function toast(t) {
  $('toast').textContent = t;
  $('toast').style.display = 'block';
  clearTimeout(window.tt);
  window.tt = setTimeout(() => $('toast').style.display = 'none', 2200);
}

function go(id, btn) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('on'));
  const target = $(id);
  if (target) target.classList.add('on');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  if (btn) btn.classList.add('on');
  scrollTo(0, 0);
}

function render(a) {
  $('list').innerHTML = a.length
    ? a.map(card).join('')
    : '<div class="empty">Nenhum lugar encontrado.</div>';
  $('homeList').innerHTML = a.slice(0, 3).map(card).join('');
}

function photoHtml(b,large=false){
  const h=large?'230px':'120px';
  return b.photo
    ? '<div class="photo" style="height:'+h+';background-image:url('+esc(b.photo)+');background-size:cover;background-position:center"></div>'
    : '<div class="photo" style="height:'+h+'">🍽️ '+esc(b.name)+'</div>';
}

function card(b){
  return '<article class="card" onclick="venue('+b.id+')" style="cursor:pointer">'+
    photoHtml(b)+
    '<div class="row"><b>'+esc(b.name)+'</b><span class="rating">★ '+(b.rating||0)+'</span></div>'+
    '<div class="muted">'+esc(b.category)+' · '+esc(b.city)+' · '+(b.reviews||0)+' avaliações</div>'+
    '<p>'+esc(b.description||'')+'</p>'+
    '<div class="muted">👆 Toque para ver detalhes</div></article>';
}

function mediaGalleryHtml(media, editable=false, bid=null){
  if(!media || !media.length) return '<div class="empty">Nenhuma foto ou vídeo na galeria ainda.</div>';
  return '<div class="mediaGrid">'+media.map(m=>{
    const content=m.media_type==='video'
      ? '<video src="'+esc(m.url)+'" controls preload="metadata"></video>'
      : '<img src="'+esc(m.url)+'" alt="'+esc(m.filename||'Foto da loja')+'">';
    const del=editable ? '<button class="mediaDelete" onclick="deleteMedia('+bid+','+m.id+')">🗑️</button>' : '';
    return '<div class="mediaItem">'+content+del+'</div>';
  }).join('')+'</div>';
}

async function getMedia(id){
  try{const j=await api('/api/businesses/'+id+'/media');return j.media||[];}catch(e){return []}
}

async function venue(id){
  go('details');
  $('detailsContent').innerHTML='<div class="empty">Carregando estabelecimento...</div>';
  try{
    const j=await api('/api/businesses/'+id), b=j.business, reviews=j.reviews||[];
    let favs={businesses:[]};
    if(token) favs=await api('/api/favorites').catch(()=>({businesses:[]}));
    const fav=(favs.businesses||[]).some(x=>Number(x.id)===Number(id));
    $('detailsContent').innerHTML=
      '<div class="card" style="margin-top:12px">'+photoHtml(b,true)+
      '<h2>'+esc(b.name)+'</h2>'+
      '<div class="muted">'+esc(b.category)+' · '+esc(b.city)+'</div>'+
      '<p>'+esc(b.description||'Sem descrição.')+'</p>'+
      '<p>📍 '+esc(b.address||'Endereço não informado')+'</p>'+
      '<p>📞 '+esc(b.phone||'Telefone não informado')+'</p>'+
      (b.whatsapp?'<p>💬 WhatsApp: '+esc(b.whatsapp)+'</p>':'')+
      (b.hours?'<p>🕐 '+esc(b.hours)+'</p>':'')+
      (b.price_range?'<p>💰 '+esc(b.price_range)+'</p>':'')+
      (b.website?'<p>🌐 <a href="'+esc(b.website)+'" target="_blank" rel="noopener">Site / Instagram</a></p>':'')+
      '<div class="row"><b>⭐ '+(b.rating||0)+'/5</b><span>'+(b.reviews||0)+' avaliações</span></div>'+
      '<button class="btn '+(fav?'secondary':'primary')+'" style="width:100%;margin-top:12px" onclick="toggleFavorite('+id+')">'+(fav?'💛 Remover dos favoritos':'🤍 Favoritar')+'</button>'+
      '<button class="btn secondary" style="width:100%;margin-top:8px" onclick="reviewBusiness('+id+')">⭐ Avaliar</button></div>'+
      '<div class="title"><h2>📸 Fotos e vídeos</h2></div>'+
      mediaGalleryHtml(j.media||[])+
      '<div class="title"><h2>⭐ Avaliações</h2></div>'+
      (reviews.length?reviews.map(r=>'<div class="card"><b>⭐ '+esc(r.rating)+'/5 · '+esc(r.name||'Usuário')+'</b><p>'+esc(r.text||'')+'</p></div>').join(''):'<div class="empty">Ainda não há avaliações.</div>');
  }catch(e){$('detailsContent').innerHTML='<div class="empty">'+esc(e.message||'Erro ao abrir estabelecimento.')+'</div>';}
       '<div class="ratingSummary"><div class="ratingBig">⭐ '+(b.rating||0)+'</div><div><b>Nota média</b><div class="muted">'+(b.reviews||0)+' avaliações</div></div></div>'+
       '<button class="btn '+(fav?'secondary':'primary')+'" style="width:100%;margin-top:12px" onclick="toggleFavorite('+id+')">'+(fav?'💛 Remover dos favoritos':'🤍 Favoritar')+'</button>'+
       '<button class="btn secondary" style="width:100%;margin-top:8px" onclick="reviewBusiness('+id+')">⭐ Avaliar</button></div>'+
       '<div class="title"><h2>📸 Fotos e vídeos</h2></div>'+
       mediaGalleryHtml(j.media||[])+
       '<div class="title"><h2>⭐ Avaliações dos clientes</h2><span class="muted">'+reviews.length+' no total</span></div>'+
       (reviews.length?reviews.map(r=>'<div class="card reviewCard"><div class="row"><b>'+esc(r.name||'Usuário')+'</b><span class="rating">'+('★'.repeat(Number(r.rating)||0))+'<span class="muted">'+('★'.repeat(5-(Number(r.rating)||0)))+'</span></span></div><div class="muted">Nota '+esc(r.rating)+'/5</div>'+(r.text?'<p>'+esc(r.text)+'</p>':'<p class="muted">Sem comentário.</p>')+'</div>').join(''):'<div class="empty">Ainda não há avaliações. Seja o primeiro a avaliar!</div>');
let reviewBusinessId=null;
let reviewRating=0;

async function reviewBusiness(id){
  if(!token){openAuth('login');return;}
  reviewBusinessId=id;
  reviewRating=0;
  $('reviewText').value='';
  document.querySelectorAll('.reviewStar').forEach(x=>x.classList.remove('on'));
  $('reviewRatingLabel').textContent='Escolha uma nota de 1 a 5 estrelas.';
  try{
    const j=await api('/api/businesses/'+id);
    $('reviewStoreName').textContent=j.business?.name ? 'Avalie: '+j.business.name : 'Sua avaliação ajuda outros usuários.';
  }catch(e){
    $('reviewStoreName').textContent='Sua avaliação ajuda outros usuários.';
  }
  $('reviewModal').classList.add('on');
}

function setReviewRating(n){
  reviewRating=n;
  document.querySelectorAll('.reviewStar').forEach(x=>x.classList.toggle('on',Number(x.dataset.rating)<=n));
  $('reviewRatingLabel').textContent=n+' de 5 estrelas';
}

function closeReview(){
  $('reviewModal').classList.remove('on');
  reviewBusinessId=null;
}

async function submitReview(){
  if(!reviewBusinessId||!reviewRating){toast('Escolha uma nota de 1 a 5 estrelas.');return;}
  const text=$('reviewText').value.trim();
  try{
    await api('/api/businesses/'+reviewBusinessId+'/reviews',{method:'POST',body:JSON.stringify({rating:reviewRating,text})});
    const id=reviewBusinessId;
    closeReview();
    toast('⭐ Avaliação salva com sucesso!');
    await venue(id);
  }catch(e){toast(e.message||'Não foi possível salvar a avaliação.');}
}

function filter(category) {
  go('explore');
  render(biz.filter(b => String(b.category || '').toLowerCase() === category.toLowerCase()));
}

function search() {
  const q = $('q').value.trim().toLowerCase();
  go('explore');
  render(biz.filter(b =>
    (b.name + ' ' + b.category + ' ' + b.city + ' ' + (b.description || ''))
      .toLowerCase().includes(q)
  ));
}

function near() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      () => toast('📍 Localização encontrada.'),
      () => toast('Permita a localização.')
    );
  } else {
    toast('Geolocalização indisponível.');
  }
}

async function load() {
  try {
    const j = await api('/api/businesses');
    biz = j.businesses || [];
    render(biz);
    loadExtras();
  } catch (e) {
    $('homeList').innerHTML =
      '<div class="empty">Não foi possível carregar os lugares agora.</div>';
  }
}

async function loadExtras() {
  try {
    let all = [];
    for (const b of biz.slice(0, 10)) {
      const j = await api('/api/businesses/' + b.id);
      all.push(...(j.events || []).map(e => ({...e, business:b.name})));
    }
    $('eventList').innerHTML = all.length
      ? all.map(e =>
        '<div class="card"><h3>🎵 ' + esc(e.title) + '</h3>' +
        '<p>' + esc(e.description || '') + '</p>' +
        '<div class="muted">' + esc(e.business) + ' · ' + esc(e.event_date || '') + '</div></div>'
      ).join('')
      : '<div class="empty">Nenhum evento cadastrado.</div>';
  } catch (e) {}
}

async function promos() {
  go('promos');
  let out = [];
  for (const b of biz.slice(0, 10)) {
    try {
      const j = await api('/api/businesses/' + b.id);
      out.push(...(j.promotions || []).map(p => ({...p, business:b.name})));
    } catch (e) {}
  }
  $('promoList').innerHTML = out.length
    ? out.map(p =>
      '<div class="card"><b>🔥 ' + esc(p.discount || 'OFERTA') + '</b>' +
      '<h3>' + esc(p.title) + '</h3><p>' + esc(p.description || '') + '</p>' +
      '<div class="muted">' + esc(p.business) + ' · ' + esc(p.valid_until || '') + '</div></div>'
    ).join('')
    : '<div class="empty">Nenhuma promoção cadastrada.</div>';
}

function openAuth(mode) {
  setMode(mode);
  $('authModal').classList.add('on');
}

function closeAuth() {
  $('authModal').classList.remove('on');
  $('authMsg').textContent = '';
}

function setMode(mode) {
  authMode = mode;
  $('authTitle').textContent = mode === 'login' ? 'Entrar' : 'Criar sua conta';
  $('loginTab').className = 'btn ' + (mode === 'login' ? 'selected' : 'secondary');
  $('registerTab').className = 'btn ' + (mode === 'register' ? 'selected' : 'secondary');
  $('nameBox').style.display = mode === 'register' ? 'block' : 'none';
  $('roleBox').style.display = mode === 'register' ? 'block' : 'none';
  $('authName').required = mode === 'register';
  $('authSubmit').textContent = mode === 'login' ? 'Entrar' : 'Criar conta';
  $('authMsg').textContent = '';
}

async function submitAuth(e) {
  e.preventDefault();
  try {
    const body = authMode === 'register'
      ? {
          name: $('authName').value.trim(),
          email: $('authEmail').value.trim(),
          password: $('authPassword').value,
          role: $('authRole').value
        }
      : {
          email: $('authEmail').value.trim(),
          password: $('authPassword').value
        };

    const j = await api(
      authMode === 'register' ? '/api/register' : '/api/login',
      {method:'POST', body:JSON.stringify(body)}
    );

    token = j.token;
    localStorage.setItem('cityja_token', token);
    updateProfile(j.user);
    closeAuth();
    toast(authMode === 'register'
      ? 'Conta criada com sucesso!'
      : 'Login realizado com sucesso!');
  } catch (e) {
    $('authMsg').textContent = e.message;
  }
}

function updateProfile(u) {
  $('pname').textContent = u.name;
  $('pemail').textContent = u.email;
  $('prole').textContent = u.role === 'merchant' ? '🏪 Comerciante' : '👤 Usuário';
  $('profileAuth').style.display = 'none';
  $('logoutBtn').style.display = 'block';
  $('merchantBtn').style.display = u.role === 'merchant' ? 'block' : 'none';
}

async function logout() {
  try {
    if (token) await api('/api/logout', {method:'POST'});
  } catch (e) {}

  localStorage.removeItem('cityja_token');
  token = null;
  $('pname').textContent = 'Visitante';
  $('pemail').textContent = '';
  $('prole').textContent = '';
  $('profileAuth').style.display = 'block';
  $('logoutBtn').style.display = 'none';
  $('merchantBtn').style.display = 'none';
  go('home');
  toast('Você saiu da conta');
}

async function saveMerchant(){
  const name=$('m_name').value.trim(), category=$('m_category').value, city=$('m_city').value.trim();
  if(!name||!category||!city){toast('Preencha Nome, Categoria e Cidade.');return;}
  try{
    let photo='';
    const file=$('m_photo')?.files?.[0];
    if(file) photo=await compressImage(file,1200,0.82);
    await api('/api/businesses',{method:'POST',body:JSON.stringify({
      name,category,city,address:$('m_address').value.trim(),
      description:$('m_description').value.trim(),phone:$('m_phone').value.trim(),
      whatsapp:$('m_whatsapp').value.trim(),website:$('m_website').value.trim(),
      hours:$('m_hours').value.trim(),price_range:$('m_price').value,photo
    })});
    toast('🎉 Loja cadastrada com sucesso!'); await load(); go('explore');
  }catch(e){toast(e.message||'Não foi possível cadastrar a loja.');}
}

function compressImage(file,maxSize,quality){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Não foi possível ler a foto.'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Imagem inválida.'));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxSize||h>maxSize){const z=Math.min(maxSize/w,maxSize/h);w=Math.round(w*z);h=Math.round(h*z);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

async function merchantData(){
  const me=await api('/api/me'), all=await api('/api/businesses');
  return (all.businesses||[]).find(b=>Number(b.owner_id)===Number(me.user.id));
}

async function uploadMedia(id){
  const files=Array.from($('media_files')?.files||[]);
  if(!files.length){toast('Escolha pelo menos uma foto ou vídeo.');return;}
  const btn=document.querySelector('#merchantFormContent button.primary');
  if(btn){btn.disabled=true;btn.textContent='⏳ Enviando...';}
  try{
    for(const f of files){
      const fd=new FormData(); fd.append('file',f,f.name);
      await apiForm('/api/businesses/'+id+'/media',{method:'POST',body:fd});
    }
    toast('✅ Mídia enviada com sucesso!');
    await merchantPhotos();
  }catch(e){toast(e.message||'Não foi possível enviar a mídia.');}
  finally{if(btn){btn.disabled=false;btn.textContent='⬆️ Enviar para a galeria';}}
}

async function deleteMedia(bid,mid){
  if(!confirm('Remover esta foto/vídeo da galeria?'))return;
  try{await api('/api/businesses/'+bid+'/media/'+mid,{method:'DELETE'});toast('🗑️ Mídia removida.');await merchantPhotos();}
  catch(e){toast(e.message);}
}

async function apiForm(u,o={}){
  o.headers={...(o.headers||{}),...(token?{'Authorization':'Bearer '+token}:{})};
  const r=await fetch(u,o);
  const j=await r.json();
  if(!r.ok)throw Error(j.error||'Erro');
  return j;
}

async function merchantPreview(){
