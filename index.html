<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071321">
<title>CityJá — Sua cidade na palma da mão</title>
<style>
:root{--bg:#06111d;--panel:#0d1b2b;--line:#20364f;--text:#f5f7fb;--muted:#9eacc0;--orange:#ff7a00;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#15385a 0,#06111d 38%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#06111de8;border-bottom:1px solid #17304a}
.brand{font-size:28px;font-weight:900}.brand i{font-style:normal;color:var(--orange)}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#0b1928;border-radius:14px;color:white}
.hero{margin:14px;padding:24px 18px;border:1px solid #29435f;border-radius:26px;background:linear-gradient(145deg,#102a43,#071522 72%)}
.hero h1{font-size:31px;line-height:1.05;margin:0 0 10px}.hero h1 span{color:var(--orange)}.hero p{color:#d5dfeb}
.search{display:flex;gap:8px;background:#091522;border:1px solid #29435f;border-radius:17px;padding:7px}.search input{flex:1;border:0;outline:0;background:transparent;color:white;padding:11px}.search button{border:0;background:var(--orange);width:44px;border-radius:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 22px}.quick button{padding:15px;border:1px solid var(--line);background:var(--panel);color:white;border-radius:18px;text-align:left}.quick b{display:block;font-size:19px}.muted{color:var(--muted)}
section{padding:0 14px}.title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}.title h2{font-size:19px;margin:0}.link{color:#ffad24;border:0;background:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{min-height:92px;border:1px solid var(--line);background:#10243a;color:white;border-radius:18px;padding:9px 4px}.cat b{display:block;font-size:27px;margin-bottom:7px}.cat span{font-size:12px}
.cards{display:grid;gap:11px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#102238,#0b1725);border-radius:19px;padding:12px}.photo{height:120px;border-radius:14px;background:linear-gradient(135deg,#253d59,#8a4b1e);display:flex;align-items:flex-end;padding:12px;font-size:18px;font-weight:850;margin-bottom:11px}.photo.p2{background:linear-gradient(135deg,#22264d,#9b3c66)}.photo.p3{background:linear-gradient(135deg,#31452b,#9a7a37)}
.row{display:flex;justify-content:space-between;gap:10px}.rating{color:#ffd15a}.screen{display:none}.screen.on{display:block}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#06111df5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
nav button{background:none;border:0;color:#8090a5;font-size:10px}nav button b{display:block;font-size:21px}nav button.on{color:var(--orange)}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(520px,100%);background:#071321;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}
.form label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.form input,.form select{width:100%;border:1px solid var(--line);background:#0b1928;color:white;border-radius:12px;padding:12px;outline:none}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.primary{background:var(--orange);color:#111}.secondary{background:#13253a;color:white;border:1px solid var(--line)}
.tabs{display:flex;gap:8px}.tabs button{flex:1}.selected{background:var(--orange);color:#111}.authmsg{min-height:22px;font-size:13px;color:#ff8295}.empty{padding:25px;text-align:center;border:1px dashed #31506e;border-radius:18px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="iconbtn" onclick="toast('Menu em breve')">☰</button>
<div class="brand">City<i>Já</i></div>
<button class="iconbtn" onclick="openAuth('login')">♙</button>
</header>

<main id="home" class="screen on">
<div class="hero">
<h1>Descubra o melhor da <span>Grande Vitória</span></h1>
<p>Tudo o que você precisa, perto de você.</p>
<div class="search"><input id="q" placeholder="Buscar lugares, serviços, eventos..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">⌕</button></div>
</div>
<div class="quick">
<button onclick="near()"><b>📍 Perto de mim</b><span class="muted">Ver tudo ao redor</span></button>
<button onclick="go('explore')"><b>🗺️ No mapa</b><span class="muted">Explorar lugares</span></button>
</div>
<section>
<div class="title"><h2>Categorias</h2><button class="link" onclick="go('explore')">Ver todas</button></div>
<div class="cats">
<button class="cat" onclick="filter('Restaurante')"><b>🍔</b><span>Restaurantes</span></button>
<button class="cat" onclick="filter('Bar')"><b>🍺</b><span>Bares</span></button>
<button class="cat" onclick="filter('Hotel')"><b>🛏️</b><span>Hotéis</span></button>
<button class="cat" onclick="filter('Motel')"><b>❤️</b><span>Motéis</span></button>
<button class="cat" onclick="filter('Comércio')"><b>🛍️</b><span>Comércio</span></button>
<button class="cat" onclick="go('events')"><b>🎵</b><span>Eventos</span></button>
<button class="cat" onclick="promos()"><b>🎟️</b><span>Promoções</span></button>
<button class="cat" onclick="filter('Café')"><b>☕</b><span>Cafés</span></button>
</div>
</section>
<section><div class="title"><h2>🔥 Destaques para você</h2></div><div id="homeList" class="cards"></div></section>
</main>

<section id="explore" class="screen"><div class="title"><h2>Explorar</h2><button class="link" onclick="go('home')">Início</button></div><div id="list" class="cards"></div></section>
<section id="events" class="screen"><div class="title"><h2>🎵 Eventos</h2></div><div id="eventList" class="cards"></div></section>
<section id="promos" class="screen"><div class="title"><h2>🎟️ Promoções</h2></div><div id="promoList" class="cards"></div></section>

<section id="profile" class="screen">
<div class="title"><h2>👤 Meu perfil</h2></div>
<div class="card"><h3 id="pname">Visitante</h3><p id="pemail" class="muted"></p><p id="prole" class="muted"></p></div>
<button id="profileAuth" class="btn primary" style="width:100%;margin-top:10px" onclick="openAuth('login')">🔐 Entrar / Criar conta</button>
<button id="logoutBtn" class="btn secondary" style="width:100%;margin-top:10px;display:none" onclick="logout()">Sair da conta</button>
</section>

<nav>
<button class="on" onclick="go('home',this)"><b>⌂</b>Início</button>
<button onclick="go('explore',this)"><b>⌕</b>Explorar</button>
<button onclick="merchantPanel ()><b>＋</b>Cadastro</button>
<button onclick="go('events',this)"><b>☆</b>Eventos</button>
<button onclick="go('profile',this)"><b>♙</b>Perfil</button>
</nav>

<div id="authModal" class="modal" onclick="if(event.target===this)closeAuth()">
<div class="sheet">
<div class="title"><h2 id="authTitle">Entrar</h2><button class="link" onclick="closeAuth()">Fechar</button></div>
<div class="tabs">
<button id="loginTab" class="btn selected" onclick="setMode('login')">Entrar</button>
<button id="registerTab" class="btn secondary" onclick="setMode('register')">Criar conta</button>
</div>
<form class="form" onsubmit="submitAuth(event)">
<div id="nameBox" style="display:none"><label>Nome</label><input id="authName" placeholder="Seu nome"></div>
<label>E-mail</label><input id="authEmail" type="email" placeholder="seu@email.com" required>
<label>Senha</label><input id="authPassword" type="password" placeholder="Mínimo de 6 caracteres" required>
<div id="roleBox" style="display:none"><label>Tipo de conta</label><select id="authRole"><option value="user">Usuário</option><option value="merchant">Comerciante</option></select></div>
<div id="authMsg" class="authmsg"></div>
<button id="authSubmit" class="btn primary" style="width:100%" type="submit">Entrar</button>
</form>
</div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:white;color:#111;padding:11px 15px;border-radius:13px;display:none;z-index:80"></div>
</div>

<script>
let biz=[],token=localStorage.getItem('cityja_token'),authMode='login';
const $=id=>document.getElementById(id);

async function api(u,o={}){
 o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})};
 const r=await fetch(u,o);const j=await r.json();
 if(!r.ok)throw Error(j.error||'Erro');return j
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}
function go(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');scrollTo(0,0)}
function render(a){$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">Nenhum lugar encontrado.</div>';$('homeList').innerHTML=a.slice(0,3).map(card).join('')}
function card(b){return '<article class="card"><div class="photo">🍽️ '+esc(b.name)+'</div><div class="row"><b>'+esc(b.name)+'</b><span class="rating">★ '+(b.rating||0)+'</span></div><div class="muted">'+esc(b.category)+' · '+esc(b.city)+' · '+(b.reviews||0)+' avaliações</div><p>'+esc(b.description||'')+'</p></article>'}
function filter(c){go('explore');render(biz.filter(b=>String(b.category).toLowerCase().includes(c.toLowerCase())))}
function search(){let q=$('q').value.trim().toLowerCase();go('explore');render(biz.filter(b=>(b.name+' '+b.category+' '+b.city+' '+(b.description||'')).toLowerCase().includes(q)))}
function near(){navigator.geolocation?navigator.geolocation.getCurrentPosition(()=>toast('📍 Localização encontrada.'),()=>toast('Permita a localização.')):toast('Geolocalização indisponível.')}
async function load(){
 try{let j=await api('/api/businesses');biz=j.businesses;render(biz);loadExtras()}
 catch(e){$('homeList').innerHTML='<div class="empty">Não foi possível carregar os lugares agora.</div>'}
}
async function loadExtras(){
 try{let all=[];for(const b of biz.slice(0,10)){let j=await api('/api/businesses/'+b.id);all.push(...j.events.map(e=>({...e,business:b.name})))}$('eventList').innerHTML=all.length?all.map(e=>'<div class="card"><h3>🎵 '+esc(e.title)+'</h3><p>'+esc(e.description||'')+'</p><div class="muted">'+esc(e.business)+' · '+esc(e.event_date||'')+'</div></div>').join(''):'<div class="empty">Nenhum evento cadastrado.</div>'
 }catch(e){}
}
async function promos(){
 go('promos');let out=[];
 for(const b of biz.slice(0,10)){try{let j=await api('/api/businesses/'+b.id);out.push(...j.promotions.map(p=>({...p,business:b.name})))}catch(e){}}
 $('promoList').innerHTML=out.length?out.map(p=>'<div class="card"><b>🔥 '+esc(p.discount||'OFERTA')+'</b><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'')+'</p><div class="muted">'+esc(p.business)+' · '+esc(p.valid_until||'')+'</div></div>').join(''):'<div class="empty">Nenhuma promoção cadastrada.</div>'
}

function openAuth(mode){setMode(mode);$('authModal').classList.add('on')}
function closeAuth(){$('authModal').classList.remove('on');$('authMsg').textContent=''}
function setMode(mode){
 authMode=mode;
 $('authTitle').textContent=mode==='login'?'Entrar':'Criar sua conta';
 $('loginTab').className='btn '+(mode==='login'?'selected':'secondary');
 $('registerTab').className='btn '+(mode==='register'?'selected':'secondary');
 $('nameBox').style.display=mode==='register'?'block':'none';
 $('roleBox').style.display=mode==='register'?'block':'none';
 $('authName').required=mode==='register';
 $('authSubmit').textContent=mode==='login'?'Entrar':'Criar conta';
 $('authMsg').textContent=''
}
async function submitAuth(e){
 e.preventDefault();
 try{
  const body=authMode==='register'
   ?{name:$('authName').value.trim(),email:$('authEmail').value.trim(),password:$('authPassword').value,role:$('authRole').value}
   :{email:$('authEmail').value.trim(),password:$('authPassword').value};
  const j=await api(authMode==='register'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify(body)});
  token=j.token;localStorage.setItem('cityja_token',token);updateProfile(j.user);closeAuth();toast(authMode==='register'?'Conta criada com sucesso!':'Login realizado com sucesso!')
 }catch(e){$('authMsg').textContent=e.message}
}
function updateProfile(u){$('pname').textContent=u.name;$('pemail').textContent=u.email;$('prole').textContent=u.role==='merchant'?'🏪 Comerciante':'👤 Usuário';$('profileAuth').style.display='none';$('logoutBtn').style.display='block'}
async function logout(){
 try{if(token)await api('/api/logout',{method:'POST'})}catch(e){}
 localStorage.removeItem('cityja_token');token=null;$('pname').textContent='Visitante';$('pemail').textContent='';$('prole').textContent='';$('profileAuth').style.display='block';$('logoutBtn').style.display='none';toast('Você saiu da conta')
}
(async()=>{try{let j=await api('/api/me');updateProfile(j.user)}catch(e){}load()})();
 function merchantPanel(){
  if(!token){
    openAuth('login');
    return;
  }

  const role = document.getElementById('prole').textContent;
  if(!role.includes('Comerciante')){
    alert('Entre com uma conta de comerciante para cadastrar um estabelecimento.');
    return;
  }

  const nome = prompt('Nome do estabelecimento:');
  if(!nome) return;

  const categoria = prompt('Categoria (ex.: Restaurante, Bar, Café):');
  if(!categoria) return;

  const cidade = prompt('Cidade:');
  if(!cidade) return;

  const endereco = prompt('Endereço:') || '';
  const descricao = prompt('Descrição do estabelecimento:') || '';

  api('/api/businesses',{
    method:'POST',
    body:JSON.stringify({
      name:nome,
      category:categoria,
      city:cidade,
      address:endereco,
      description:descricao
    })
  }).then(()=>{
    alert('Estabelecimento cadastrado com sucesso! 🎉');
    load();
    go('explore');
  }).catch(e=>{
    alert(e.message);
  });
}
</script>
</body>
</html>
