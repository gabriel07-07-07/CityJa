<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071321"><title>CityJá — Sua cidade na palma da mão</title>
<style>
:root{--bg:#06111d;--panel:#0d1b2b;--panel2:#12253a;--line:#20364f;--text:#f5f7fb;--muted:#9eacc0;--orange:#ff7a00;--orange2:#ffad24;--green:#39d98a;--blue:#4f8cff;--red:#ff4f6d;--shadow:0 14px 40px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#15385a 0,#06111d 38%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#06111de8;backdrop-filter:blur(18px);border-bottom:1px solid #17304a}.brand{font-size:28px;font-weight:900;letter-spacing:-1.2px}.brand i{font-style:normal;color:var(--orange)}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#0b1928;border-radius:14px;color:white}.hero{margin:14px 14px 18px;padding:24px 18px 18px;border:1px solid #29435f;border-radius:26px;background:linear-gradient(145deg,#102a43,#071522 72%);box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-80px;top:-80px;background:#ff7a0028;filter:blur(4px)}.hero h1{font-size:32px;line-height:1.03;margin:0 0 10px;letter-spacing:-1.5px;position:relative;z-index:1}.hero h1 span{color:var(--orange)}.hero p{color:#d5dfeb;margin:0 0 18px}.search{display:flex;gap:8px;background:#091522;border:1px solid #29435f;border-radius:17px;padding:7px}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;padding:11px}.search button{border:0;background:var(--orange);color:#111;width:44px;border-radius:12px;font-weight:900}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 22px}.quick button{padding:15px;border:1px solid var(--line);background:var(--panel);color:white;border-radius:18px;text-align:left}.quick b{display:block;font-size:21px;margin-bottom:3px}.muted{color:var(--muted)}section{padding:0 14px}.title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 11px}.title h2{font-size:19px;margin:0}.link{color:var(--orange2);border:0;background:none}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{min-height:92px;border:1px solid var(--line);background:linear-gradient(180deg,#12243a,#0a1726);color:white;border-radius:18px;padding:9px 4px}.cat b{display:block;font-size:27px;margin-bottom:7px}.cat span{font-size:12px}.cards{display:grid;gap:11px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#102238,#0b1725);border-radius:19px;padding:12px;box-shadow:0 7px 24px #0005}.photo{height:120px;border-radius:14px;background:linear-gradient(135deg,#253d59,#8a4b1e);display:flex;align-items:flex-end;padding:12px;font-size:18px;font-weight:850;margin-bottom:11px}.photo.p2{background:linear-gradient(135deg,#22264d,#9b3c66)}.photo.p3{background:linear-gradient(135deg,#31452b,#9a7a37)}.row{display:flex;justify-content:space-between;gap:10px}.rating{color:#ffd15a;white-space:nowrap}.pill{display:inline-block;background:#142943;border:1px solid #254361;color:#bcd0e6;border-radius:99px;padding:5px 9px;font-size:11px;margin:3px 4px 0 0}.screen{display:none}.screen.on{display:block}.explorebar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:var(--panel);color:#dbe5f1;border-radius:99px;padding:9px 12px;white-space:nowrap}.detailHero{height:220px;border-radius:22px;background:linear-gradient(145deg,#4b2d15,#b96a26);display:flex;align-items:flex-end;padding:18px;margin-top:12px}.detailHero h1{margin:0;font-size:26px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.action{border:1px solid var(--line);background:var(--panel);color:white;border-radius:15px;padding:11px 4px;font-size:11px}.action b{display:block;font-size:21px;margin-bottom:3px}.info{border-top:1px solid var(--line);padding:14px 0}.review{padding:12px 0;border-top:1px solid var(--line)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#06111df5;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}nav button{background:none;border:0;color:#8090a5;font-size:10px}nav button b{display:block;font-size:21px;margin-bottom:2px}nav button.on{color:var(--orange)}.fab{position:relative;margin-top:-24px}.fab b{width:54px;height:54px;display:grid;place-items:center;background:var(--orange);color:#111;border-radius:50%;font-size:28px!important;box-shadow:0 8px 25px #ff7a0055;margin:auto}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(520px,100%);background:#071321;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.form label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:#0b1928;color:white;border-radius:12px;padding:12px;outline:none}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.primary{background:var(--orange);color:#111}.secondary{background:#13253a;color:white;border:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:white;color:#111;padding:11px 15px;border-radius:13px;display:none;z-index:80;box-shadow:var(--shadow)}.empty{padding:25px;text-align:center;border:1px dashed #31506e;border-radius:18px;color:var(--muted)}
</style></head><body><div class="app">
<header class="top"><button class="iconbtn" onclick="toast('Menu em breve')">☰</button><div class="brand">City<i>Já</i></div><button class="iconbtn" onclick="toast('Você não tem novas notificações')">♧</button></header>
<main id="home" class="screen on">
<div class="hero"><h1>Descubra o melhor da <span>Grande Vitória</span></h1><p>Tudo o que você precisa, perto de você.</p><div class="search"><input id="q" placeholder="Buscar lugares, serviços, eventos..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">⌕</button></div></div>
<div class="quick"><button onclick="near()"><b>📍 Perto de mim</b><span class="muted">Ver tudo ao redor</span></button><button onclick="go('explore')"><b>🗺️ No mapa</b><span class="muted">Explorar lugares</span></button></div>
<section><div class="title"><h2>Categorias</h2><button class="link" onclick="go('explore')">Ver todas</button></div><div class="cats">
<button class="cat" onclick="filter('Restaurante')"><b>🍔</b><span>Restaurantes</span></button><button class="cat" onclick="filter('Bar')"><b>🍺</b><span>Bares</span></button><button class="cat" onclick="filter('Hotel')"><b>🛏️</b><span>Hotéis</span></button><button class="cat" onclick="filter('Motel')"><b>❤️</b><span>Motéis</span></button><button class="cat" onclick="filter('Comércio')"><b>🛍️</b><span>Comércio</span></button><button class="cat" onclick="go('events')"><b>🎵</b><span>Eventos</span></button><button class="cat" onclick="go('promos')"><b>🎟️</b><span>Promoções</span></button><button class="cat" onclick="filter('Café')"><b>☕</b><span>Cafés</span></button></div></section>
<section><div class="title"><h2>🔥 Destaques para você</h2><button class="link" onclick="go('explore')">Ver todos</button></div><div id="homeList" class="cards"></div></section>
</main>
<section id="explore" class="screen"><div class="title"><h2>Explorar</h2><button class="link" onclick="go('home')">Início</button></div><div class="explorebar"><button class="chip" onclick="near()">📍 Perto de mim</button><button class="chip" onclick="render(biz.filter(x=>(x.rating||0)>=4))">⭐ 4+</button><button class="chip" onclick="toast('Filtro de aberto agora será ligado aos horários reais')">🟢 Aberto agora</button></div><div class="title"><h2>Todos os lugares</h2></div><div id="list" class="cards"></div></section>
<section id="venue" class="screen"><button class="btn secondary" onclick="go('explore')">← Voltar</button><div id="venueBox"></div></section>
<section id="events" class="screen"><div class="title"><h2>🎵 Eventos</h2></div><div id="eventList" class="cards"></div></section>
<section id="promos" class="screen"><div class="title"><h2>🎟️ Promoções</h2></div><div id="promoList" class="cards"></div></section>
<section id="fav" class="screen"><div class="title"><h2>❤️ Favoritos</h2></div><div id="favList" class="cards"></div></section>
<section id="profile" class="screen"><div class="title"><h2>👤 Meu perfil</h2></div><div class="card"><h3 id="pname">Visitante</h3><p id="pemail" class="muted"></p></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="favorites()">❤️ Meus favoritos</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="toast('Área do comerciante disponível na próxima etapa')">🏪 Área do comerciante</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="logout()">Sair</button></section>
<nav><button class="on" onclick="go('home',this)"><b>⌂</b>Início</button><button onclick="go('explore',this)"><b>⌕</b>Explorar</button><button class="fab" onclick="toast('Em breve: anunciar negócio')"><b>＋</b></button><button onclick="go('events',this)"><b>☆</b>Eventos</button><button onclick="go('profile',this)"><b>♙</b>Perfil</button></nav>
<div id="toast" class="toast"></div></div>
<script>
let biz=[],current=null,token=localStorage.getItem('cityja_token');const $=id=>document.getElementById(id);
async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})};const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2300)}
function go(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');window.scrollTo(0,0)}
function photoClass(i){return i%3===1?'photo p2':i%3===2?'photo p3':'photo'}
function render(a){$('list').innerHTML=a.length?a.map((b,i)=>card(b,i)).join(''):'<div class="empty">Nenhum lugar encontrado.</div>';$('homeList').innerHTML=a.slice(0,3).map((b,i)=>card(b,i)).join('')}
function card(b,i=0){return `<article class="card" onclick="venue(${b.id})"><div class="${photoClass(i)}">${b.category?.includes('Bar')?'🍺':b.category?.includes('Café')?'☕':b.category?.includes('Hotel')?'🛏️':'🍽️'} ${esc(b.name)}</div><div class="row"><b>${esc(b.name)}</b><span class="rating">★ ${b.rating||0}</span></div><div class="muted">${esc(b.category)} · ${esc(b.city)} · ${b.reviews||0} avaliações</div><p>${esc(b.description||'')}</p></article>`}
function filter(c){go('explore');render(biz.filter(b=>String(b.category).toLowerCase().includes(c.toLowerCase())))}
function search(){let q=$('q').value.trim().toLowerCase();go('explore');render(biz.filter(b=>(b.name+' '+b.category+' '+b.city+' '+(b.description||'')).toLowerCase().includes(q)))}
function near(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>toast('📍 Localização encontrada. Ordenação por distância entra na próxima etapa.'),()=>toast('Permita a localização para usar Perto de mim.'));else toast('Geolocalização indisponível.')}
async function venue(id){current=biz.find(b=>b.id==id);let j=await api('/api/businesses/'+id);$('venueBox').innerHTML=`<div class="detailHero"><h1>${esc(j.business.name)}</h1></div><div class="title"><h2>${esc(j.business.name)}</h2><span class="rating">★ ${j.business.rating||0}</span></div><div class="muted">${esc(j.business.category)} · ${esc(j.business.city)}</div><div class="actions"><button class="action" onclick="toast('Ligação em breve')"><b>☎</b>Ligar</button><button class="action" onclick="toast('WhatsApp em breve')"><b>◉</b>WhatsApp</button><button class="action" onclick="toast('Mapa em breve')"><b>➤</b>Como chegar</button><button class="action" onclick="toast('Site em breve')"><b>◎</b>Site</button></div><div class="info">📍 ${esc(j.business.address||j.business.city)}<br>🕒 Horário será conectado ao cadastro do estabelecimento.</div><div class="info"><b>Sobre</b><p>${esc(j.business.description||'Sem descrição ainda.')}</p></div><div class="info"><b>⭐ Avaliações (${j.reviews.length})</b>${j.reviews.length?j.reviews.map(r=>`<div class="review"><b>${esc(r.name)}</b> <span class="rating">★ ${r.rating}</span><div class="muted">${esc(r.text||'')}</div></div>`).join(''):'<p class="muted">Ainda não há avaliações.</p>'}</div>`;go('venue')}
async function load(){try{let j=await api('/api/businesses');biz=j.businesses;render(biz);loadExtras()}catch(e){$('homeList').innerHTML='<div class="empty">Não foi possível carregar os lugares agora.</div>'}}
async function loadExtras(){try{let all=[];for(const b of biz.slice(0,10)){let j=await api('/api/businesses/'+b.id);all.push(...j.events.map(e=>({...e,business:b.name})));} $('eventList').innerHTML=all.length?all.map(e=>`<div class="card"><span class="pill">🎵 EVENTO</span><h3>${esc(e.title)}</h3><p>${esc(e.description||'')}</p><div class="muted">${esc(e.business)} · ${esc(e.event_date||'Data a confirmar')}</div></div>`).join(''):'<div class="empty">Nenhum evento cadastrado ainda.</div>'}catch(e){}}
async function favorites(){try{let j=await api('/api/favorites');$('favList').innerHTML=j.businesses.length?j.businesses.map((b,i)=>card(b,i)).join(''):'<div class="empty">Você ainda não tem favoritos.</div>';go('fav')}catch(e){toast('Entre em uma conta para usar favoritos.') ;go('profile')}}
async function promos(){go('promos');let out=[];for(const b of biz.slice(0,10)){try{let j=await api('/api/businesses/'+b.id);out.push(...j.promotions.map(p=>({...p,business:b.name})))}catch(e){}}$('promoList').innerHTML=out.length?out.map(p=>`<div class="card"><span class="pill">🔥 ${esc(p.discount||'OFERTA')}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><div class="muted">${esc(p.business)} · Válida até ${esc(p.valid_until||'')}</div></div>`).join(''):'<div class="empty">Nenhuma promoção cadastrada ainda.</div>'}
async function logout(){if(token)try{await api('/api/logout',{method:'POST'})}catch(e){}localStorage.removeItem('cityja_token');token=null;location.reload()}
(async()=>{try{let j=await api('/api/me');$('pname').textContent=j.user.name;$('pemail').textContent=j.user.email}catch(e){}load()})();
</script></body></html>
